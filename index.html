<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قەڵادزێ بازاڕ | Qaladze Bazar</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #0b1120;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --accent: #22c55e;
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.18);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
    }

    .nav-wrap {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, input, select, textarea {
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    button {
      cursor: pointer;
      padding: 8px 14px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      transition: 0.18s ease;
    }

    button:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary-dark);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary);
      color: #082f49;
    }

    .btn-success {
      background: #15803d;
      border-color: var(--accent);
      color: #fff;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }

    .btn-ghost {
      background: transparent;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 22px 18px 60px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-btn.active {
      background: var(--primary-dark);
      border-color: var(--primary);
      color: #fff;
    }

    .search-box {
      min-width: 220px;
      flex: 1;
      max-width: 320px;
      padding: 9px 12px;
      background: var(--surface);
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-img {
      width: 100%;
      height: 175px;
      object-fit: cover;
      background: var(--surface-2);
      display: block;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .badge {
      align-self: flex-start;
      font-size: 0.75rem;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.28);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--muted);
      flex: 1;
      white-space: pre-line;
    }

    .card-footer {
      padding: 12px 14px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .price {
      font-weight: 800;
      color: #4ade80;
      font-size: 1rem;
    }

    .empty-state {
      text-align: center;
      padding: 56px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
    }

    .empty-state h3 {
      color: var(--text);
      margin-bottom: 8px;
      font-size: 1.15rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .modal-head h2 {
      font-size: 1.15rem;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 9px 12px;
      background: var(--surface-2);
      color: var(--text);
      width: 100%;
    }

    .form-group textarea {
      min-height: 76px;
      resize: vertical;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      background: var(--surface-2);
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .cart-item-sub {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .qty-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-box button {
      padding: 4px 10px;
    }

    .admin-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .admin-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      background: var(--surface-2);
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid var(--primary);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: 0.22s ease;
      z-index: 90;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-wrap">
      <div class="brand">
        <span class="brand-title">قەڵادزێ بازاڕ — Qaladze Bazar</span>
        <span class="brand-sub">داواکاری خێرا بە واتسئەپ و تێلیگرام</span>
      </div>
      <div class="nav-actions">
        <button id="openCartBtn" class="btn-primary">
          سەبەتە (<span id="cartCount">0</span>)
        </button>
        <button id="openAdminBtn" class="btn-ghost">ئەدمین</button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="categories" id="categoryTabs">
        <button class="cat-btn active" data-cat="هەموو">هەموو</button>
        <button class="cat-btn" data-cat="ئەلیکترۆنی">ئەلیکترۆنی</button>
        <button class="cat-btn" data-cat="کەلوپەل">کەلوپەل</button>
      </div>
      <input id="searchInput" class="search-box" type="search" placeholder="گەڕان بەدوای کاڵا..." />
    </div>

    <section id="productsGrid" class="grid"></section>
  </main>

  <div id="cartModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <div class="modal-head">
        <h2>سەبەتەی داواکاری</h2>
        <button type="button" data-close="cartModal">داخستن</button>
      </div>
      <div id="cartItemsContainer"></div>
      <div id="cartSummary" style="margin: 14px 0; font-weight: 800; font-size: 1.05rem;"></div>

      <div class="form-group">
        <label for="customerName">ناوی کڕیار</label>
        <input id="customerName" type="text" placeholder="ناوت بنووسە" />
      </div>
      <div class="form-group">
        <label for="customerPhone">ژمارەی مۆبایل</label>
        <input id="customerPhone" type="tel" placeholder="0750..." />
      </div>
      <div class="form-group">
        <label for="customerAddress">ناونیشان (بۆ نموونە: قەڵادزێ)</label>
        <input id="customerAddress" type="text" placeholder="گەڕەک یان ناونیشانی گەیاندن" />
      </div>

      <div class="row-actions" style="margin-top: 14px;">
        <button id="orderWhatsappBtn" type="button" class="btn-success" style="flex: 1;">
          ناردن بۆ واتسئەپ
        </button>
        <button id="orderTelegramBtn" type="button" class="btn-primary" style="flex: 1;">
          ناردن بۆ تێلیگرام
        </button>
      </div>
    </div>
  </div>

  <div id="adminLoginModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-head">
        <h2>چوونەژوورەوەی ئەدمین</h2>
        <button type="button" data-close="adminLoginModal">داخستن</button>
      </div>
      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminPassInput">کۆدی نهێنی</label>
          <input id="adminPassInput" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">چوونەژوورەوە</button>
      </form>
    </div>
  </div>

  <div id="adminPanelModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal">
      <div class="modal-head">
        <h2>بەڕێوەبردنی کاڵاکان</h2>
        <div class="row-actions">
          <button id="adminLogoutBtn" type="button" class="btn-danger">دەرچوون</button>
          <button type="button" data-close="adminPanelModal">داخستن</button>
        </div>
      </div>

      <form id="addProductForm">
        <div class="form-group">
          <label for="prodName">ناوی کاڵا</label>
          <input id="prodName" type="text" required placeholder="نموونە: هێدفۆنی بێ وایەر" />
        </div>
        <div class="form-group">
          <label for="prodPrice">نرخ (دینار یان دۆلار)</label>
          <input id="prodPrice" type="number" step="any" min="0" required placeholder="نموونە: 25000" />
        </div>
        <div class="form-group">
          <label for="prodCategory">پۆلێن</label>
          <select id="prodCategory">
            <option value="ئەلیکترۆنی">ئەلیکترۆنی</option>
            <option value="کەلوپەل">کەلوپەل</option>
          </select>
        </div>
        <div class="form-group">
          <label for="prodImage">لینک یان وێنەی کاڵا (ئارەزوومەندانە)</label>
          <input id="prodImage" type="text" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label for="prodDesc">کورتە وەسف</label>
          <textarea id="prodDesc" placeholder="زانیاری کورت دەربارەی کاڵاکە..."></textarea>
        </div>
        <button type="submit" class="btn-success" style="width: 100%;">زیادکردنی کاڵا</button>
      </form>

      <div class="admin-section">
        <h3 style="margin-bottom: 10px; font-size: 1rem;">پشتگیری و گواستنەوەی داتا (
